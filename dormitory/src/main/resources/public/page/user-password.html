<link rel="stylesheet" href="../css/silkstyle/silkstyle.css">


<div class="layuimini-main">
    <div class="layui-form layuimini-form" lay-filter="passwordForm" style="width: 80%;margin-top: 20px;">
        <div class="layui-form-item">
            <label class="layui-form-label required">原密码</label>
            <div class="layui-input-block">
                <input type="password" name="oldPassword" lay-verify="required" lay-reqtext="原密码不能为空" placeholder="请输入原密码" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="newPassword" lay-verify="required|pass" lay-reqtext="新密码不能为空" placeholder="请输入新密码（不少于6位）" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">确认新密码</label>
            <div class="layui-input-block">
                <input type="password" name="confirmPassword" lay-verify="required|pass" lay-reqtext="确认密码不能为空" placeholder="请再次输入新密码" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" style="text-align: center;margin-top: 30px;">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认修改</button>
            </div>
        </div>
    </div>

</div>
<script>
    layui.use(['form', 'layer', 'axios'], function () {
        let form = layui.form,
            layer = layui.layer,
            axios = layui.axios,
            $ = layui.$;

        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 当前登录用户信息（由后端Token拦截器解析token得到）
        let currentUser = null;

        axios.get('student/info', {}).then(function (response) {
            currentUser = response.data;
        }).catch(function (error) {
            console.log(error);
        });

        // 自定义校验：密码长度不少于6位
        form.verify({
            pass: function (value, item) {
                if (value.length < 6) {
                    return '密码长度不能少于6位';
                }
            }
        });

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            let field = data.field;

            if (field.newPassword !== field.confirmPassword) {
                layer.msg('两次输入的新密码不一致');
                return false;
            }
            if (field.newPassword === field.oldPassword) {
                layer.msg('新密码不能与原密码相同');
                return false;
            }

            // 先调用登录接口验证原密码是否正确
            axios.post('login', {
                userName: currentUser.userName,
                userPwd: field.oldPassword,
                userType: currentUser.userType
            }).then(function (loginRes) {
                // 原密码正确，提交修改（updateSelective只更新非空字段，故仅传id和密码）
                axios.post('user/update', {
                    id: currentUser.id,
                    userPwd: field.newPassword
                }).then(function (updateRes) {
                    layer.msg('密码修改成功，请牢记新密码');
                    $('input[name="oldPassword"]').val('');
                    $('input[name="newPassword"]').val('');
                    $('input[name="confirmPassword"]').val('');
                }).catch(function (error) {
                    layer.msg(error || '密码修改失败');
                });
            }).catch(function (error) {
                // login接口验证失败时，error为后台返回的msg
                layer.msg('原密码错误');
            });
            return false;
        });

    });
</script>
