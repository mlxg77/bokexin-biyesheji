<div class="layuimini-container layuimini-page-anim">
    <div class="layuimini-main">
        <div style="margin: 10px 10px 10px 10px">
            <form class="layui-form layui-form-pane" action="">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">年份</label>
                        <div class="layui-input-inline">
                            <input type="text" name="billYear" autocomplete="off" placeholder="如：2026" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-inline">
                        <label class="layui-form-label">月份</label>
                        <div class="layui-input-inline">
                            <input type="text" name="billMonth" autocomplete="off" placeholder="1-12" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <input type="text" name="paid" autocomplete="off" placeholder="0/1/2" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-inline">
                        <button type="submit" class="layui-btn layui-btn-primary"  lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe615;</i> 搜 索</button>
                    </div>
                </div>
            </form>
        </div>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="generate">
                    <i class="layui-icon layui-icon-add-circle"></i>生成本月账单
                </button>
                <button class="layui-btn layui-btn-warm layui-btn-sm data-add-btn" lay-event="pay">
                    <i class="layui-icon layui-icon-rmb"></i>支付账单
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                    <i class="layui-icon layui-icon-delete"></i>删除
                </button>
            </div>
        </script>

        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
    </div>
</div>


<script>
    layui.use(['form', 'table', 'layer'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            layer = layui.layer;

        // 我所在寝室的水电账单（水5元/吨，电1元/度）
        table.render({
            elem: '#currentTableId',
            method: 'post',
            url: 'bill/query_my',
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [[
                {type: "checkbox", width: 50},
                {field: 'id', width: 80, title: 'ID', sort: true},
                {field: 'billYear', width: 90, title: '年份', sort: true},
                {field: 'billMonth', width: 90, title: '月份', sort: true},
                {field: 'buildingId', width: 100, title: '楼栋号', templet: function (row) {
                        return row.buildingId + '栋';
                    }},
                {field: 'roomId', width: 110, title: '房间号', templet: '<div>{{d.room.brand}}</div>'},
                {field: 'waterUsed', width: 110, title: '用水量(吨)'},
                {field: 'waterFee', width: 110, title: '水费(元)'},
                {field: 'energyUsed', width: 110, title: '用电量(度)'},
                {field: 'energyFee', width: 110, title: '电费(元)'},
                {field: 'totalFee', width: 110, title: '总费用(元)'},
                {field: 'paid', title: '账单状态', sort: true, templet: function (row) {
                        if (row.paid === 0){
                            return '<span class="layui-badge layui-bg-silk-silver">等待推送⏳</span>';
                        } else if (row.paid === 1){
                            return '<span class="layui-badge layui-bg-orange">待支付🔔</span>';
                        } else if (row.paid === 2){
                            return '<span class="layui-badge layui-bg-silk-yellowgreen">已支付✨</span>';
                        }
                    }}
            ]],
            limits: [10, 15, 20, 30, 50, 100],
            limit: 10,
            page: true,
            skin: 'line'
        });


        window.reload = function () {
            table.reload('currentTableId');     // 刷新表格
        }


        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            //执行搜索重载
            table.reload('currentTableId', {
                where: data.field
            }, 'data');

            return false;
        });

        /**
         * toolbar事件监听
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'generate') {                                 // 🌸随机生成本月账单
                layer.confirm("将为您的寝室随机生成本月水电账单（水5元/吨，电1元/度），确定吗？", function (index) {
                    axios.post('bill/generate', {}).then(function (response) {
                        layer.close(index);
                        layer.msg(response.msg);
                        table.reload('currentTableId');                    // 重新加载表格
                    }).catch(function (error) {
                        layer.close(index);
                        layer.msg(error);
                    });
                })
            } else if (obj.event === 'pay') {                               // 🌸支付账单
                let data = table.checkStatus('currentTableId').data;
                if (data.length === 0){
                    layer.msg("还没有选中数据");
                } else if (data.length !== 1) {
                    layer.msg("只能选择一条账单进行支付");
                } else {
                    if (data[0].paid !== 1){
                        layer.msg("只有已推送给您的账单才能支付哦");
                        return;
                    }
                    layer.confirm("确认支付" + data[0].billYear + "年" + data[0].billMonth + "月的水电费" + data[0].totalFee + "元吗？", function (index) {
                        axios.post('bill/pay', {id:data[0].id}).then(function (response) {
                            layer.close(index);
                            layer.msg(response.msg);
                            table.reload('currentTableId');                // 重新加载表格
                        }).catch(function (error) {
                            layer.close(index);
                            layer.msg(error);
                        });
                    })
                }
            } else if (obj.event === 'delete') {                           // 🌸删除账单
                let data = table.checkStatus('currentTableId').data;
                if (data.length === 0){
                    layer.msg("还没有选中数据");
                } else{
                    layer.confirm("真的要删除吗", function (index) {
                        let arr = data.map(item=>item.id);                   // 异步删除(包括map, filter, some, every)

                        axios.get('bill/delete?ids=' + arr.join(",")).then(function (response) {
                            table.reload('currentTableId');
                            layer.msg(response.msg);
                        }).catch(function (error) {
                            layer.msg(error);
                        });
                        layer.close(index);
                    })
                }
            }
        });
    });
</script>
